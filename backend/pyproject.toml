[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rastro-api"
version = "0.1.0"
description = "Backend API for Rastro"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1,<2",
    "fastapi",
    "pydantic-settings",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2,<3",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
