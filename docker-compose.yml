services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rastro
      POSTGRES_USER: rastro
      POSTGRES_PASSWORD: rastro
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastro -d rastro"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
